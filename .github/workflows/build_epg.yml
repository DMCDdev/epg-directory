name: Build EPG Directory

on:
  schedule:
    # Runs daily at 4:00 AM PHT (20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EPG directory & README" && git push)
